name: Notify IndexNow (Bing) on deploy

on:
  push:
    branches:
      - main

jobs:
  submit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Submit sitemap URLs to IndexNow
        run: |
          KEY="c404c1938b1c4d20dbf113a448904942"
          HOST="www.lucasyleodigital.com"
          KEY_LOCATION="https://${HOST}/${KEY}.txt"

          URLS=$(python3 -c "
          import re
          content = open('sitemap.xml', encoding='utf-8').read()
          locs = re.findall(r'<loc>(.*?)</loc>', content)
          import json
          print(json.dumps(locs))
          ")

          echo "Submitting URLs: $URLS"

          curl -s -X POST "https://api.indexnow.org/IndexNow" \
            -H "Content-Type: application/json; charset=utf-8" \
            -d "{\"host\":\"${HOST}\",\"key\":\"${KEY}\",\"keyLocation\":\"${KEY_LOCATION}\",\"urlList\":${URLS}}"
